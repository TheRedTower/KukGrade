components:
  schemas:
    ActionEnum:
      enum:
      - SESSION_CREATED
      - SESSION_TRANSITIONED
      - SESSION_DELETED
      - CANDIDATE_REGISTERED
      - CANDIDATE_UPDATED
      - CANDIDATE_WITHDRAWN
      - CANDIDATE_DELETED
      - ASSESSMENT_GENERATED
      - ASSESSMENT_STARTED
      - ASSESSMENT_COMPLETED
      - ITEM_RESULT_RECORDED
      - OUTCOME_CREATED
      - OUTCOME_PROPOSED
      - OUTCOME_FINALISED
      - PROMOTION_RECORDED
      - STUDENT_CREATED
      - STUDENT_UPDATED
      - STUDENT_STATUS_CHANGED
      - USER_CREATED
      - USER_UPDATED
      - USER_AUTHORITY_CHANGED
      type: string
      description: |-
        * `SESSION_CREATED` - Grading session created
        * `SESSION_TRANSITIONED` - Grading session transitioned
        * `SESSION_DELETED` - Grading session deleted
        * `CANDIDATE_REGISTERED` - Candidate registered
        * `CANDIDATE_UPDATED` - Candidate updated
        * `CANDIDATE_WITHDRAWN` - Candidate withdrawn
        * `CANDIDATE_DELETED` - Candidate deleted
        * `ASSESSMENT_GENERATED` - Assessment generated
        * `ASSESSMENT_STARTED` - Assessment started
        * `ASSESSMENT_COMPLETED` - Assessment completed
        * `ITEM_RESULT_RECORDED` - Assessment item result recorded
        * `OUTCOME_CREATED` - Outcome created
        * `OUTCOME_PROPOSED` - Outcome proposed
        * `OUTCOME_FINALISED` - Outcome finalised
        * `PROMOTION_RECORDED` - Promotion recorded
        * `STUDENT_CREATED` - Student created
        * `STUDENT_UPDATED` - Student updated
        * `STUDENT_STATUS_CHANGED` - Student status changed
        * `USER_CREATED` - User created
        * `USER_UPDATED` - User updated
        * `USER_AUTHORITY_CHANGED` - User authority changed
    AgeBandEnum:
      enum:
      - AGE_8_AND_UNDER
      - AGE_9_TO_12
      - AGE_13_TO_17
      - AGE_18_AND_OVER
      type: string
      description: |-
        * `AGE_8_AND_UNDER` - 8 and under
        * `AGE_9_TO_12` - 9-12
        * `AGE_13_TO_17` - 13-17
        * `AGE_18_AND_OVER` - 18+
    AuditEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        action_display:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        metadata:
          readOnly: true
      required:
      - action
      - action_display
      - actor
      - actor_email
      - actor_name
      - entity_id
      - entity_type
      - id
      - metadata
      - occurred_at
      - summary
    CandidateAssessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        candidate:
          type: integer
          readOnly: true
        candidate_student_name:
          type: string
          readOnly: true
        candidate_student_wksa_id:
          type: string
          readOnly: true
        testing_for_rank_code:
          type: string
          readOnly: true
        testing_for_rank_name:
          type: string
          readOnly: true
        age_band:
          type: string
          readOnly: true
        age_band_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/CandidateAssessmentStatusEnum'
        status_display:
          type: string
          readOnly: true
        generated_by:
          type: string
          format: uuid
          readOnly: true
        generated_by_email:
          type: string
          format: email
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
        item_counts:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_band
      - age_band_display
      - candidate
      - candidate_student_name
      - candidate_student_wksa_id
      - completed_at
      - created_at
      - generated_at
      - generated_by
      - generated_by_email
      - id
      - item_counts
      - started_at
      - status_display
      - testing_for_rank_code
