          readOnly: true
          nullable: true
        manageable:
          type: boolean
          readOnly: true
          description: Whether the signed-in user may change this account; only a
            superuser changes one that can use the Django admin site.
      required:
      - can_make_final_grading_decision
      - can_override_locked_session
      - can_promote_student
      - can_view_grading_audit_log
      - date_joined
      - email
      - full_name
      - id
      - last_login
      - manageable
      - must_change_password
      - role_display
      - temporary_password_expires_at
    UserManagementRequest:
      type: object
      description: |-
        List, retrieve, create and update for the administrator-facing API.

        Deliberately separate from UserSerializer, which is a fixed read-only
        self-view for /api/auth/me/: that one has no reason to expose is_active
        or date_joined about the caller to themselves, and has no reason to be
        writable at all. Sharing one class between the two would couple changes
        meant for one endpoint to the other.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
      required:
      - email
    VoidLegacyRecordRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
    WithdrawalReason:
      type: object
      description: One withdrawal reason, from its code, and whether it needs a note.
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/WithdrawalReasonEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        note_required:
          type: boolean
          readOnly: true
      required:
      - code
      - name
      - note_required
    WithdrawalReasonEnum:
      enum:
      - INJURY
      - WITHDREW
      - ABSENT
      - OTHER
      type: string
      description: |-
        * `INJURY` - Injured during grading
        * `WITHDREW` - Withdrew voluntarily
        * `ABSENT` - Did not attend
        * `OTHER` - Other
    WksaIdForm:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        pattern:
          type: string
          description: A regular expression the whole ID must match.
        example:
          type: string
      required:
      - code
      - example
      - label
      - pattern
    WksaIdScheme:
      type: object
      properties:
        hint:
          type: string
          description: The rule in a sentence, as a refused ID is told it.
        forms:
          type: array
          items:
            $ref: '#/components/schemas/WksaIdForm'
      required:
      - forms
      - hint
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
