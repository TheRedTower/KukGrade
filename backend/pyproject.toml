[project]
name = "kukgrade-backend"
version = "0.2.0"
description = "The Django REST API for KukGrade."
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2,<27.0",
    "openpyxl>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "reportlab>=4.4,<5.0",
    "whitenoise[brotli]>=6.12,<7.0",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<6.0",
    "djangorestframework-stubs>=3.16,<4.0",
    "mypy>=1.18,<3.0",
    # Reads the text back out of the PDFs the exports make, in their tests.
    "pypdf>=6.0,<7.0",
    # Held below 9.2: pytest-xdist 3.8.0 (the newest) cannot group tests under
    # pytest 9.2, so demo/test_club.py would build its club on every worker. Lift
    # with the Dependabot ignore once a newer pytest-xdist is out.
    "pytest>=9.0,<9.2",
    "pytest-django>=4.11,<5.0",
    "pytest-xdist>=3.8,<4.0",
    "ruff>=0.14,<1.0",
    "types-reportlab>=5.1,<6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kukgrade.settings_test"
# With -n, tests marked xdist_group stay on one worker (demo/test_club.py builds
# its club once, on that worker); every other test is spread one by one.
# The suite relies on this order: a test marked transaction=True empties every
# table when it ends, including the ranks and permission groups migrations seed,
# and pytest-django runs those tests last so nothing follows them on a worker.
# Do not switch to --dist loadfile: it mixes them in and 546 tests fail.
addopts = "--dist loadgroup"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
markers = [
    "concurrency: real-thread tests of database locking under a genuine race. Deselect with -m 'not concurrency' if one proves flaky in a given CI environment.",
]
testpaths = [
    "about",
    "kukgrade",
    "accounts",
    "audit",
    "health",
    "ranks",
    "students",
    "syllabus",
    "gradings",
    "data_imports",
    "demo",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ008"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
disallow_any_generics = false

# No published type stubs. Reads every uploaded .xlsx: the roster reader and
# the KSW workbook adapter (data_imports/parsers.py, ksw_adapter.py).
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# Generated code: regenerating a migration after a model change would just
# undo any hand-added type: ignore, so migrations are excluded from strict
# checking rather than hand-maintained (django-stubs' own convention).
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
# Points at the test settings module because the real one fails closed: it
# raises ImproperlyConfigured without DJANGO_SECRET_KEY, which the plugin
# cannot satisfy. settings_test star-imports settings, so the type
# information is identical.
django_settings_module = "kukgrade.settings_test"
