# nginx in front of KukGrade, ending TLS. One proxy in front: DJANGO_NUM_PROXIES=1.
#   docker compose -f deploy/compose.yml -f deploy/compose.bundled-db.yml \
#     -f deploy/proxies/nginx.yml up -d --build
# (Paths in these files are relative to deploy/, where compose.yml is.)
# Put your certificate and key in deploy/proxies/nginx/certs/ as fullchain.pem
# and privkey.pem. With a name that has a public address, a certbot or other ACME
# client that writes those two files is the usual way to get them.
services:
  app:
    ports: !reset []
    environment:
      # One proxy in front by default. Set DJANGO_NUM_PROXIES in deploy/.env to
      # change it (for example 2 with Cloudflare in front of this proxy).
      DJANGO_NUM_PROXIES: "${DJANGO_NUM_PROXIES:-1}"

  nginx:
    image: nginx:1.29-alpine
    container_name: kukgrade-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxies/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxies/nginx/certs:/certs:ro
