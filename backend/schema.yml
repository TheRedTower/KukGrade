      - first_name
      - issues
      - last_name
      - outcome
      - row_number
      - status
      - wksa_id
    StudentList:
      type: object
      description: |-
        The list representation. Deliberately excludes date of birth.

        Date of birth is the most sensitive field held, on people who may be
        minors. It appears on a single record an instructor deliberately opened,
        never in a page of two hundred names.
      properties:
        id:
          type: integer
          readOnly: true
        wksa_id:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        current_rank:
          type: integer
          readOnly: true
        current_rank_code:
          type: string
          readOnly: true
        current_rank_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StudentStatusEnum'
