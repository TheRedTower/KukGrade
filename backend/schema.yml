        status_display:
          type: string
          readOnly: true
        generated_by_email:
          type: string
          format: email
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
