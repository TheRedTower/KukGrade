    PatchedSelfProfile:
      type: object
      description: |-
        PATCH /api/auth/me/.

        Everything UserSerializer exposes, but first_name and last_name become
        writable - the only things a user may change about themselves. Email,
        role and authority stay administrator-only, on UserManagementSerializer;
        a separate serializer keeps "what a user can do to themselves" from ever
        silently growing alongside admin capabilities.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        role_display:
          type: string
          readOnly: true
        can_make_final_grading_decision:
          type: boolean
          readOnly: true
        can_promote_student:
          type: boolean
          readOnly: true
        can_override_locked_session:
          type: boolean
          readOnly: true
        can_view_grading_audit_log:
          type: boolean
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
    PatchedStudent:
      type: object
      description: |-
        Detail, create and update. wksa_id is writable only on create.

        One serializer rather than three: create and update share every field
        except wksa_id, and splitting them further would just be the same
        fields copied into different classes.
