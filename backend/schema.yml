          type: boolean
        can_make_final_grading_decision:
          type: boolean
          readOnly: true
        can_promote_student:
          type: boolean
          readOnly: true
        can_override_locked_session:
          type: boolean
          readOnly: true
        can_view_grading_audit_log:
          type: boolean
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        temporary_password_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        manageable:
          type: boolean
          readOnly: true
          description: Whether the signed-in user may change this account; only a
            superuser changes one that can use the Django admin site.
        temporary_password:
          type: string
          readOnly: true
      required:
      - can_make_final_grading_decision
      - can_override_locked_session
      - can_promote_student
      - can_view_grading_audit_log
      - date_joined
      - email
      - full_name
      - id
      - last_login
      - manageable
      - must_change_password
      - role_display
      - temporary_password
      - temporary_password_expires_at
