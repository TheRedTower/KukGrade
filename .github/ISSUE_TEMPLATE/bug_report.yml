name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not include real student data**: no names,
        dates of birth or IDs. Blur screenshots or use made-up values.
        Security problems go through the Security tab, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an instructor
        2. Open a grading session…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the About page, or the image tag / commit you run.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker (the image, own database)
        - Docker (external PostgreSQL)
        - Behind a reverse proxy or tunnel
        - From source (development)
        - Something else
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose logs --tail=100`. Remove anything private."
      render: text
