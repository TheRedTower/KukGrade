        * `GRADING_RESULT` - Grading result
        * `AUXILIARY_NOTE` - Auxiliary note
        * `DID_NOT_ATTEND` - Did not attend
    RegisteredCandidate:
      type: object
      properties:
        candidate:
          $ref: '#/components/schemas/GradingCandidate'
        assessment:
          allOf:
          - $ref: '#/components/schemas/CandidateAssessment'
          nullable: true
      required:
      - assessment
      - candidate
    ResolveLegacyRank:
      type: object
      description: '`rank=null` explicitly leaves the mapping unresolved.'
      properties:
        rank:
          type: integer
          nullable: true
      required:
      - rank
    ResultEnum:
      enum:
      - NOT_ASSESSED
      - MET
      - NOT_MET
      type: string
      description: |-
        * `NOT_ASSESSED` - Not assessed
        * `MET` - Met
        * `NOT_MET` - Not met
    RoleEnum:
      enum:
      - instructor
      - administrator
      type: string
      description: |-
        * `instructor` - Instructor
        * `administrator` - Administrator
    SetPassword:
      type: object
      description: |-
        POST /api/users/{id}/set-password/.

        A separate action rather than a writable field on UserManagementSerializer,
        so a plain PATCH to a user's other details can never carry a password
        change as a side effect.
      properties:
        password:
          type: string
          writeOnly: true
      required:
      - password
    SourceEnum:
      enum:
      - KUKGRADE
      - LEGACY
      type: string
      description: |-
        * `KUKGRADE` - KUKGRADE
        * `LEGACY` - LEGACY
    Student:
      type: object
      description: |-
        Detail, create and update. wksa_id is writable only on create.

        One serializer rather than three: create and update share every field
        except wksa_id, and splitting them further would just be the same
        fields copied into different classes.
      properties:
        id:
          type: integer
          readOnly: true
        wksa_id:
          type: string
          maxLength: 32
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_of_birth:
          type: string
          format: date
        current_rank:
          type: integer
        current_rank_code:
          type: string
          readOnly: true
        current_rank_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StudentStatusEnum'
        status_display:
          type: string
          readOnly: true
        can_be_graded:
          type: boolean
          readOnly: true
        age_band:
          type: string
          readOnly: true
        age_band_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_band
      - age_band_display
      - can_be_graded
      - created_at
      - current_rank
      - current_rank_code
      - current_rank_name
      - date_of_birth
      - first_name
      - id
      - last_name
      - status_display
      - updated_at
      - wksa_id
    StudentGradingHistory:
      type: object
      description: |-
        Combines finalised native outcomes with linked, non-voided legacy
        records - kept deliberately separate from
        StudentRankHistorySerializer/`/rank-history/`, which remains
        Promotion-only (import Decision 6).
      properties:
        student:
          type: integer
          readOnly: true
        student_display_name:
          type: string
          readOnly: true
        student_wksa_id:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/GradingHistoryItem'
      required:
      - items
      - student
      - student_display_name
      - student_wksa_id
    StudentImportPreview:
      type: object
      properties:
        total:
          type: integer
        ready:
          type: integer
        review_required:
          type: integer
        skip_existing:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/StudentImportRowResult'
      required:
      - ready
      - review_required
      - rows
      - skip_existing
      - total
    StudentImportRequest:
      type: object
      description: Shared request shape for the preview and commit actions.
      properties:
        column_mapping:
          type: object
          additionalProperties:
            type: string
        corrections:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
      required:
      - column_mapping
    StudentImportRowOutcomeEnum:
      enum:
      - READY
      - REVIEW_REQUIRED
      - SKIP_EXISTING
      type: string
      description: |-
        * `READY` - Ready
        * `REVIEW_REQUIRED` - Needs review
        * `SKIP_EXISTING` - Skip - WKSA ID exists
    StudentImportRowResult:
      type: object
      properties:
