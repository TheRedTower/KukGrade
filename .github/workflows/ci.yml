name: CI

on:
  # Every branch, not just dev/prod. The repo convention is to merge feature
  # branches into dev directly, so triggering on dev alone would only verify
  # a change after it had already landed.
  push:
  pull_request:

# A superseded run on the same branch is cancelled rather than left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kukgrade
          POSTGRES_USER: kukgrade
          POSTGRES_PASSWORD: kukgrade_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukgrade -d kukgrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The settings module now fails closed: management commands refuse to
      # start without a secret key unless DJANGO_DEBUG is true. Tests supply
      # their own via kukgrade.settings_test.
      DJANGO_SECRET_KEY: ci-only-secret-key-000000000000000000000000000000000000
      POSTGRES_DB: kukgrade
      POSTGRES_USER: kukgrade
      POSTGRES_PASSWORD: kukgrade_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy kukgrade health accounts audit ranks students syllabus gradings data_imports

      - name: Django system checks
        run: uv run python manage.py check

      - name: Migrations match models
        run: uv run python manage.py makemigrations --check --dry-run

      # Blocking at WARNING since KG-NEXT-004: the deployment check is clean,
      # so any new security warning fails the build rather than scrolling past.
      - name: Deployment checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: kukgrade.example.com

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # Pinned to an LTS line that Vite 7 supports. Local development is
      # currently on a newer Node; add an .nvmrc if that drift ever bites.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerated from backend/schema.yml (both checked out from the same
      # commit) rather than hand-maintained - see the 2026-09-14 decision log
      # entry. A serializer change that nobody mirrors here fails the build
      # instead of silently drifting from the API.
      - name: Generate API types from schema
        run: npm run generate:types

      - name: Generated types are current
        run: git diff --exit-code -- src/api/schema.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # Gated at critical while KG-020 is open: there are currently 5 high and
      # 3 moderate advisories, all in dev/build tooling rather than the shipped
      # react runtime. Tighten to `--audit-level=high` once KG-020 is cleared.
      - name: Dependency audit
        run: npm audit --audit-level=critical
