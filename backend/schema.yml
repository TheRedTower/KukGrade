      - current_rank
      - current_rank_name
      - date_of_birth
      - deleted_at
      - deletion_blocked_by
      - extra_information
      - first_name
      - id
      - last_name
      - next_rank
      - next_rank_name
      - previous_wksa_ids
      - status_display
      - wksa_id
