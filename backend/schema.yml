components:
  schemas:
    About:
      type: object
      properties:
        version:
          type: string
          description: The version of KukGrade running.
        release:
          type: string
          description: 'The version as it is named to people: the version, followed
            by -rc.N on a release candidate.'
        commit:
          type: string
          description: The commit it was built from; blank when run from a checkout.
        built_at:
          type: string
          format: date-time
          nullable: true
          description: When it was built; null when run from a checkout.
        time_zone:
          type: string
          description: The club's time zone.
        database:
          allOf:
          - $ref: '#/components/schemas/DatabaseEnum'
          description: |-
            Whether the database answers right now.

            * `ok` - ok
            * `unavailable` - unavailable
        repository_url:
          type: string
          description: Where the source code is published.
        issues_url:
          type: string
          description: Where problems are reported in public.
        releases_url:
          type: string
          description: Where each version's release notes are.
        support_email:
          type: string
          description: Where to ask for help.
        security_email:
          type: string
          description: Where to report a security weakness.
        licence:
          type: string
          description: The licence, as an SPDX identifier.
        copyright:
          type: string
          description: The copyright notice.
        school:
          allOf:
          - $ref: '#/components/schemas/School'
          description: 'Present only for administrators: the school''s settings, read-only.'
      required:
      - built_at
      - commit
      - copyright
      - database
      - issues_url
      - licence
      - release
      - releases_url
      - repository_url
      - security_email
      - support_email
      - time_zone
      - version
    ActionEnum:
      enum:
      - SESSION_CREATED
      - SESSION_UPDATED
      - SESSION_TRANSITIONED
      - SESSION_DELETED
      - SESSION_ARCHIVED
      - SESSION_RESTORED
      - CANDIDATE_REGISTERED
      - CANDIDATE_UPDATED
      - CANDIDATE_WITHDRAWN
      - CANDIDATE_DELETED
      - ASSESSMENT_GENERATED
      - ASSESSMENT_STARTED
      - ASSESSMENT_UPDATED
      - ASSESSMENT_COMPLETED
      - ASSESSMENT_DELETED
      - ITEM_RESULT_RECORDED
      - ITEM_COMMENT_ADDED
      - OUTCOME_CREATED
      - OUTCOME_PROPOSED
      - OUTCOME_FINALISED
      - PROMOTION_RECORDED
      - STUDENT_CREATED
      - STUDENT_UPDATED
      - STUDENT_STATUS_CHANGED
      - STUDENT_DELETED
      - USER_CREATED
      - USER_UPDATED
      - USER_AUTHORITY_CHANGED
      - USER_DELETED
      - IMPORT_BATCH_COMMITTED
      - IMPORT_BATCH_CANCELLED
      - IMPORT_BATCH_EXPIRED
      - LEGACY_GRADING_LINKED
      - LEGACY_GRADING_UNLINKED
      - LEGACY_GRADING_RANK_RESOLVED
      - LEGACY_GRADING_VOIDED
      - AUDIT_REDACTED
      type: string
      description: |-
        * `SESSION_CREATED` - Grading session created
        * `SESSION_UPDATED` - Grading session updated
        * `SESSION_TRANSITIONED` - Grading session status changed
        * `SESSION_DELETED` - Grading session deleted
        * `SESSION_ARCHIVED` - Grading session archived
        * `SESSION_RESTORED` - Grading session restored from the archive
        * `CANDIDATE_REGISTERED` - Candidate registered
        * `CANDIDATE_UPDATED` - Candidate updated
        * `CANDIDATE_WITHDRAWN` - Candidate withdrawn
        * `CANDIDATE_DELETED` - Candidate deleted
        * `ASSESSMENT_GENERATED` - Assessment form prepared
        * `ASSESSMENT_STARTED` - Assessment started
        * `ASSESSMENT_UPDATED` - Assessment notes updated
        * `ASSESSMENT_COMPLETED` - Assessment completed
        * `ASSESSMENT_DELETED` - Assessment deleted
        * `ITEM_RESULT_RECORDED` - Assessment item result recorded
        * `ITEM_COMMENT_ADDED` - Assessment item comment added
        * `OUTCOME_CREATED` - Outcome record opened
        * `OUTCOME_PROPOSED` - Outcome proposed
        * `OUTCOME_FINALISED` - Outcome finalised
        * `PROMOTION_RECORDED` - Promotion recorded
        * `STUDENT_CREATED` - Student created
        * `STUDENT_UPDATED` - Student updated
        * `STUDENT_STATUS_CHANGED` - Student status changed
        * `STUDENT_DELETED` - Student deleted
        * `USER_CREATED` - User created
        * `USER_UPDATED` - User updated
        * `USER_AUTHORITY_CHANGED` - User authority changed
        * `USER_DELETED` - User deleted
        * `IMPORT_BATCH_COMMITTED` - Import finished
        * `IMPORT_BATCH_CANCELLED` - Import cancelled
        * `IMPORT_BATCH_EXPIRED` - Import expired
        * `LEGACY_GRADING_LINKED` - Historical record linked
        * `LEGACY_GRADING_UNLINKED` - Historical record unlinked
        * `LEGACY_GRADING_RANK_RESOLVED` - Historical record rank resolved
        * `LEGACY_GRADING_VOIDED` - Historical record voided
        * `AUDIT_REDACTED` - Personal details erased from the audit log
    AgeBand:
      type: object
