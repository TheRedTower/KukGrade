    ImportBatchCreateRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        file:
          type: string
          format: binary
        sheet:
          type: string
          description: A roster workbook's sheet to read; else the one it opens on.
      required:
      - file
      - kind
    ImportBatchCreated:
      type: object
      description: |-
        The new import's id, and whether this exact file was imported before -
        the one thing only the upload knows. Everything else, its headers and
        suggested matches included, is the import's own (batches/{id}/).
      properties:
        id:
          type: integer
          readOnly: true
        already_imported_warning:
          type: boolean
          readOnly: true
      required:
      - already_imported_warning
      - id
    ImportBatchStatusEnum:
      enum:
      - UPLOADED
      - COMMITTED
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `UPLOADED` - Uploaded
        * `COMMITTED` - Imported
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
    ImportField:
      type: object
      description: One field of KukGrade's a roster's columns are matched to.
      properties:
        field:
          type: string
        name:
          type: string
          description: The field's name on screen.
        needed:
          type: boolean
          description: Every student must have it.
        whole_file:
          type: boolean
          description: It can be given once for the whole file.
      required:
      - field
      - name
      - needed
      - whole_file
    ImportMappingRequest:
      type: object
      description: |-
        POST /{id}/mapping/: how a roster maps onto KukGrade.

        A column for each field, a whole-file value for a field the file lacks
        (current_rank or status only), and the columns to keep as extra
        information. A needed field with neither is typed into each row as a fix.
        A refusal names the part it is about: column_mapping, defaults or
        extra_columns.
      properties:
        column_mapping:
          type: object
          additionalProperties:
            type: string
        defaults:
          type: object
          additionalProperties:
            type: string
          description: current_rank and/or status, used where a row has none.
        extra_columns:
          type: array
          items:
            type: string
            minLength: 1
          description: The file's columns to keep as each student's extra information.
      required:
      - column_mapping
    ImportRecordsVoidRequest:
      type: object
      description: 'POST /{id}/void-records/: void every record a historical import
        made.'
      properties:
        reason:
          type: string
          minLength: 1
          description: Why, kept on every record.
      required:
      - reason
    ImportRecordsVoided:
      type: object
      properties:
        voided:
          type: integer
          description: How many records were voided.
      required:
      - voided
    ImportRow:
      type: object
      description: One stored row and what the last check made of it.
      properties:
        row_number:
          type: integer
          readOnly: true
        source_locator:
          type: string
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/StudentImportRowOutcomeEnum'
          readOnly: true
        outcome_display:
          type: string
          readOnly: true
        excluded:
          type: boolean
          readOnly: true
        values:
          type: object
          additionalProperties:
            type: string
          description: The row's values by KukGrade field, as checked - for a roster
            wksa_id, first_name, last_name, date_of_birth, current_rank and status;
            for historical gradings name, period, current_rank, testing_for_rank,
            outcome, report, section and note.
        issues:
          type: array
          items:
            type: string
          description: A roster row's problems, or a historical record's reasons to
            look at it (none of which stop the import).
        issue_fields:
          type: array
          items:
            type: string
          description: The fields the issues are about (a roster's), to mark them.
        corrected_fields:
          type: array
          items:
            type: string
          readOnly: true
          description: The fields whose value is the importer's fix, not the file's.
        extra:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: The row's values in the columns kept as extra information.
        cells:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: A roster row's every cell by column heading, as the file has
            it, the columns not imported included; empty for historical gradings.
        file_values:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: A roster row's matched fields as the file has them, before
            any fix; empty for historical gradings.
        created_id:
          type: string
          readOnly: true
      required:
      - cells
      - corrected_fields
      - created_id
      - excluded
      - extra
      - file_values
      - issue_fields
      - issues
      - outcome
      - outcome_display
      - row_number
      - source_locator
      - values
    ImportRowCounts:
