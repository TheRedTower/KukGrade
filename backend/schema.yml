      type: object
      properties:
        session:
          type: integer
    PatchedGradingSessionRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        grading_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/GradingSessionStatusEnum'
        location:
          type: string
          maxLength: 200
        notes:
          type: string
        cancellation_reason:
          type: string
          writeOnly: true
    PatchedImportRowCorrectionRequest:
      type: object
      description: |-
        PATCH /{id}/rows/{row_number}/: a roster row's fixes, by field.

        A null value takes the fix away, so the file's own value is used again.
      properties:
        wksa_id:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          nullable: true
        current_rank:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
    PatchedSelfProfileRequest:
      type: object
      description: |-
        PATCH /api/auth/me/.

        Everything UserSerializer exposes, but first_name and last_name become
        writable - the only things a user may change about themselves. Email,
        role and authority stay administrator-only, on UserManagementSerializer;
        a separate serializer keeps "what a user can do to themselves" from ever
        silently growing alongside admin capabilities.
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    PatchedStudentRequest:
      type: object
      description: |-
        Detail, create and update.

        One serializer rather than three: create and update share every field,
        and splitting them would just copy the same fields into different
        classes. wksa_id can be corrected if mistyped, and a student ID becomes
        the black belt ID WKSA hands out; a black belt ID never goes back to a
        student ID (Student.clean()). wksa_id_can_change says whether the change
        to a black belt ID is still to come.
      properties:
        wksa_id:
          type: string
          minLength: 1
          maxLength: 32
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        date_of_birth:
          type: string
          format: date
        current_rank:
          type: integer
        status:
          $ref: '#/components/schemas/StudentStatusEnum'
    PatchedUserAuthorityRequest:
      type: object
      description: |-
        PATCH /api/users/{id}/authority/.

        Same keys /api/auth/me/ returns, so the concept is spelled one way
        throughout rather than the read shape and the write shape drifting.
      properties:
        can_make_final_grading_decision:
          type: boolean
        can_promote_student:
          type: boolean
        can_override_locked_session:
          type: boolean
        can_view_grading_audit_log:
          type: boolean
    PatchedUserManagementRequest:
      type: object
      description: |-
        List, retrieve, create and update for the administrator-facing API.

        Deliberately separate from UserSerializer, which is a fixed read-only
        self-view for /api/auth/me/: that one has no reason to expose is_active
        or date_joined about the caller to themselves, and has no reason to be
        writable at all. Sharing one class between the two would couple changes
        meant for one endpoint to the other.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
    Pledge:
      type: object
