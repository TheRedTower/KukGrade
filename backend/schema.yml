          readOnly: true
          nullable: true
        assessor_notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assessed_at
      - assessment
