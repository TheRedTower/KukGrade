openapi: 3.0.3
info:
  title: KukGrade API
  version: 0.2.0
  description: Grading management API for Kuk Sool Won instructors and administrators.
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      description: |-
        What is running: the About page, and what to quote when asking for help.

        For anyone signed in. Nothing here is personal data, but a build's exact
        version and commit are more than the sign-in page needs to show. The
        school's own settings are added for administrators only.
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
          description: ''
  /api/about/credits/:
    get:
      operationId: about_credits_retrieve
      description: |-
        The software KukGrade is built on, as written when this version was
        built. Not available when run from a checkout.
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credits'
          description: ''
  /api/about/credits/notices/:
    get:
      operationId: about_credits_notices_retrieve
      description: The full third-party licence notices, as a text file.
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Every package, with its licence text.
  /api/about/documents/{slug}/:
    get:
      operationId: about_documents_retrieve
      description: |-
        One of the project's own documents: the licence, the code of conduct or
        the security policy, read from the file the repository holds.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/about/pledge/:
    get:
      operationId: about_pledge_retrieve
      description: The Kuk Sool Won pledge, in English and Korean.
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pledge'
          description: ''
  /api/audit-events/:
    get:
      operationId: audit_events_list
      description: 'Read-only by construction: the model refuses writes from every
        path.'
      parameters:
      - name: action
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - ASSESSMENT_COMPLETED
          - ASSESSMENT_DELETED
          - ASSESSMENT_GENERATED
          - ASSESSMENT_STARTED
          - ASSESSMENT_UPDATED
          - AUDIT_REDACTED
          - CANDIDATE_DELETED
          - CANDIDATE_REGISTERED
          - CANDIDATE_UPDATED
          - CANDIDATE_WITHDRAWN
          - IMPORT_BATCH_CANCELLED
          - IMPORT_BATCH_COMMITTED
          - IMPORT_BATCH_EXPIRED
          - ITEM_COMMENT_ADDED
          - ITEM_RESULT_RECORDED
          - LEGACY_GRADING_LINKED
          - LEGACY_GRADING_RANK_RESOLVED
          - LEGACY_GRADING_UNLINKED
          - LEGACY_GRADING_VOIDED
          - OUTCOME_CREATED
          - OUTCOME_FINALISED
          - OUTCOME_PROPOSED
          - PROMOTION_RECORDED
          - SESSION_ARCHIVED
          - SESSION_CREATED
          - SESSION_DELETED
          - SESSION_RESTORED
          - SESSION_TRANSITIONED
          - SESSION_UPDATED
          - STUDENT_CREATED
          - STUDENT_DELETED
          - STUDENT_STATUS_CHANGED
          - STUDENT_UPDATED
          - USER_AUTHORITY_CHANGED
          - USER_CREATED
          - USER_DELETED
          - USER_UPDATED
      - name: entity_id
        required: false
        in: query
        description: ''
        schema:
          type: string
      - name: entity_type
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - AuditLog
          - CandidateAssessment
          - CandidateAssessmentItem
          - CandidateOutcome
          - GradingCandidate
          - GradingSession
          - ImportBatch
          - LegacyGradingRecord
          - Promotion
          - Student
          - User
      - name: occurred_from
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: occurred_to
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 'Every word, in the summary, record number, actor, the kind of
          event or record, or the current name of the student the event is about (read
          now: events hold no names).'
        schema:
          type: string
      - name: subject
        required: false
        in: query
        description: 'The history of one record and everything that belongs to it:
          `session:ID`, `student:ID`, `candidate:ID` or `user:ID`.'
        schema:
          type: string
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/audit-events/labels/:
    get:
      operationId: audit_events_labels_retrieve
      description: |-
        The event and record types the caller may filter by, with their
        names - the same events visible_to() lets them read.
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLabels'
          description: ''
  /api/audit-events/subject/:
    get:
      operationId: audit_events_subject_retrieve
      description: 'What a history is of: the record''s current name and where to
        open it.'
      parameters:
      - in: query
        name: subject
        schema:
          type: string
        required: true
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSubject'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/data-imports/batches/:
    get:
      operationId: data_imports_batches_list
      description: |-
        Administrator-only bulk data import.

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - name: kind
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - LEGACY_GRADINGS
          - STUDENT_ROSTER
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: status
        required: false
        in: query
        description: Comma-separated; one of CANCELLED, COMMITTED, EXPIRED, UPLOADED.
        schema:
          type: string
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportBatchList'
          description: ''
    post:
      operationId: data_imports_batches_create
      description: |-
        Administrator-only bulk data import.

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchCreated'
          description: ''
  /api/data-imports/batches/{batch_pk}/rows/:
    get:
      operationId: data_imports_batches_rows_list
      description: The import's rows, a page at a time, in file order.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - name: corrected
        required: false
        in: query
        description: Only rows with (or without) a fix of the importer's.
        schema:
          type: boolean
      - name: filled
        required: false
        in: query
        description: A roster's rows whose value for this field the file did not give
          and nobody typed in, so the whole-file value or KukGrade's default was used.
        schema:
          type: string
          enum:
          - current_rank
          - status
      - name: outcome
        required: false
        in: query
        description: Only rows with this outcome.
        schema:
          type: string
          enum:
          - EXCLUDED
          - READY
          - REVIEW_REQUIRED
          - SKIP_EXISTING
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: rank_text
        required: false
        in: query
        description: A historical import's rows that write a rank this way, held or
          tested for (any case).
        schema:
          type: string
      - name: record_kind
        required: false
        in: query
        description: A historical import's rows of these kinds. Comma-separated; one
          of AUXILIARY_NOTE, DID_NOT_ATTEND, GRADING_RESULT.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Any of the row's values.
        schema:
          type: string
      - name: worth_a_look
        required: false
        in: query
        description: 'Only rows with (or without) issues: for a historical import,
          the records worth a look, left out or not.'
        schema:
          type: boolean
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportRowList'
          description: ''
  /api/data-imports/batches/{batch_pk}/rows/{row_number}/:
    patch:
      operationId: data_imports_batches_rows_partial_update
      description: Fix a roster row's values; every row is checked again.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - in: path
        name: row_number
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRow'
          description: ''
  /api/data-imports/batches/{batch_pk}/rows/{row_number}/exclusion/:
    post:
      operationId: data_imports_batches_rows_exclusion_create
      description: Leave a row out of the import, or bring it back.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - in: path
        name: row_number
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRow'
          description: ''
  /api/data-imports/batches/{batch_pk}/rows/leave-out-attention/:
    post:
      operationId: data_imports_batches_rows_leave_out_attention_create
      description: Leave out every roster row still needing attention, in one go.
      parameters:
      - in: path
        name: batch_pk
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/:
    get:
      operationId: data_imports_batches_retrieve
      description: |-
        Administrator-only bulk data import.

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/cancel/:
    post:
      operationId: data_imports_batches_cancel_create
      description: |-
        Administrator-only bulk data import.

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/data-imports/batches/{id}/commit/:
    post:
      operationId: data_imports_batches_commit_create
      description: |-
        Finish the import from what is stored: a roster's mapping and fixes,
        or a historical import's rank choices.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/mapping/:
    post:
      operationId: data_imports_batches_mapping_create
      description: Match a roster's columns to KukGrade's fields, and check every
        row.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/preview/:
    post:
      operationId: data_imports_batches_preview_create
      description: |-
        A historical import's rank choices, saved when given, and what it
        would do. A roster's columns are matched with mapping/ instead.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyImportRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyImportPreview'
          description: ''
  /api/data-imports/batches/{id}/sheet/:
    post:
      operationId: data_imports_batches_sheet_create
      description: |-
        Read a roster from another sheet of its workbook; the column matches
        and fixes made for the old sheet go.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/void-records/:
    post:
      operationId: data_imports_batches_void_records_create
      description: |-
        Void every record a finished historical import created - for a
        wrong file imported. Records are never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRecordsVoided'
          description: ''
  /api/gradings/assessment-items/:
    get:
      operationId: gradings_assessment_items_list
      parameters:
      - name: assessment
        required: false
        in: query
        description: ''
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateAssessmentItemList'
          description: ''
  /api/gradings/assessment-items/{id}/:
    patch:
      operationId: gradings_assessment_items_partial_update
      description: Mark an item, and get the assessment's counts back with it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment
          item.
        required: true
      tags:
      - gradings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAssessmentItemSaved'
          description: ''
  /api/gradings/assessment-items/{id}/comments/:
    post:
      operationId: gradings_assessment_items_comments_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment
          item.
        required: true
      tags:
      - gradings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentItemCommentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssessmentItemCommentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssessmentItemCommentRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentItemComment'
          description: ''
  /api/gradings/assessments/:
    get:
      operationId: gradings_assessments_list
      parameters:
      - name: candidate
        required: false
        in: query
        description: ''
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: session
        required: false
        in: query
        description: ''
        schema:
