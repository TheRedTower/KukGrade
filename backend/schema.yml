components:
  schemas:
    ActionEnum:
      enum:
      - SESSION_CREATED
      - SESSION_TRANSITIONED
      - SESSION_DELETED
      - CANDIDATE_REGISTERED
      - CANDIDATE_UPDATED
      - CANDIDATE_WITHDRAWN
      - CANDIDATE_DELETED
      - ASSESSMENT_GENERATED
      - ASSESSMENT_STARTED
      - ASSESSMENT_COMPLETED
      - ASSESSMENT_DELETED
      - ITEM_RESULT_RECORDED
      - OUTCOME_CREATED
      - OUTCOME_PROPOSED
      - OUTCOME_FINALISED
      - PROMOTION_RECORDED
      - STUDENT_CREATED
      - STUDENT_UPDATED
      - STUDENT_STATUS_CHANGED
      - STUDENT_DELETED
      - USER_CREATED
      - USER_UPDATED
      - USER_AUTHORITY_CHANGED
      - USER_DELETED
      - IMPORT_BATCH_COMMITTED
      - IMPORT_BATCH_CANCELLED
      - IMPORT_BATCH_EXPIRED
      - LEGACY_GRADING_LINKED
      - LEGACY_GRADING_UNLINKED
      - LEGACY_GRADING_RANK_RESOLVED
      - LEGACY_GRADING_VOIDED
      type: string
      description: |-
        * `SESSION_CREATED` - Grading session created
        * `SESSION_TRANSITIONED` - Grading session transitioned
        * `SESSION_DELETED` - Grading session deleted
        * `CANDIDATE_REGISTERED` - Candidate registered
        * `CANDIDATE_UPDATED` - Candidate updated
        * `CANDIDATE_WITHDRAWN` - Candidate withdrawn
        * `CANDIDATE_DELETED` - Candidate deleted
        * `ASSESSMENT_GENERATED` - Assessment generated
        * `ASSESSMENT_STARTED` - Assessment started
        * `ASSESSMENT_COMPLETED` - Assessment completed
        * `ASSESSMENT_DELETED` - Assessment deleted
        * `ITEM_RESULT_RECORDED` - Assessment item result recorded
        * `OUTCOME_CREATED` - Outcome created
        * `OUTCOME_PROPOSED` - Outcome proposed
        * `OUTCOME_FINALISED` - Outcome finalised
        * `PROMOTION_RECORDED` - Promotion recorded
        * `STUDENT_CREATED` - Student created
        * `STUDENT_UPDATED` - Student updated
        * `STUDENT_STATUS_CHANGED` - Student status changed
        * `STUDENT_DELETED` - Student deleted
        * `USER_CREATED` - User created
        * `USER_UPDATED` - User updated
        * `USER_AUTHORITY_CHANGED` - User authority changed
        * `USER_DELETED` - User deleted
        * `IMPORT_BATCH_COMMITTED` - Import batch committed
        * `IMPORT_BATCH_CANCELLED` - Import batch cancelled
        * `IMPORT_BATCH_EXPIRED` - Import batch expired
        * `LEGACY_GRADING_LINKED` - Legacy grading record linked
        * `LEGACY_GRADING_UNLINKED` - Legacy grading record unlinked
        * `LEGACY_GRADING_RANK_RESOLVED` - Legacy grading record rank resolved
        * `LEGACY_GRADING_VOIDED` - Legacy grading record voided
    AgeBandEnum:
      enum:
      - AGE_8_AND_UNDER
      - AGE_9_TO_12
      - AGE_13_TO_17
      - AGE_18_AND_OVER
      type: string
      description: |-
        * `AGE_8_AND_UNDER` - 8 and under
        * `AGE_9_TO_12` - 9-12
        * `AGE_13_TO_17` - 13-17
        * `AGE_18_AND_OVER` - 18+
    AssessmentCategorySummary:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the two `summary`
        endpoints return. Neither of them serializes a model, and without this the
        generated contract claims the viewset's own `serializer_class`. Read-only:
        nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
        all_required_met:
          type: boolean
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/SyllabusItemCategoryEnum'
          readOnly: true
        category_display:
          type: string
          readOnly: true
      required:
      - all_required_assessed
      - all_required_met
      - category
      - category_display
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - required_not_met
      - total
    AssessmentSummaryCounts:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the two `summary`
        endpoints return. Neither of them serializes a model, and without this the
        generated contract claims the viewset's own `serializer_class`. Read-only:
        nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
        all_required_met:
          type: boolean
          readOnly: true
      required:
      - all_required_assessed
      - all_required_met
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - required_not_met
      - total
    AttendanceStatusEnum:
