        * `AGE_13_TO_17` - 13-17
        * `AGE_18_AND_OVER` - 18+
    AssessmentCategorySummary:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the assessment `summary`
        endpoint and each assessment's `overall` return. Neither serializes a
        model, and without this the generated contract claims the viewset's own
        `serializer_class`. Read-only: nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/SyllabusItemCategoryEnum'
          readOnly: true
      required:
      - all_required_assessed
      - category
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - total
    AssessmentSummaryCounts:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the assessment `summary`
        endpoint and each assessment's `overall` return. Neither serializes a
        model, and without this the generated contract claims the viewset's own
        `serializer_class`. Read-only: nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
      required:
      - all_required_assessed
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - total
    AttendanceStatusEnum:
