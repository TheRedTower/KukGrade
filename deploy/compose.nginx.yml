# KukGrade behind nginx, which ends TLS. Put your certificate and key in
# ./certs as fullchain.pem and privkey.pem.
#   docker compose -f compose.nginx.yml up -d
services:
  kukgrade:
    image: ghcr.io/theredtower/kukgrade:latest
    restart: unless-stopped
    stop_grace_period: 2m
    env_file: .env
    volumes:
      - ./data:/var/lib/kukgrade

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
