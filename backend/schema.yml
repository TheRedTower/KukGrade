    ImportBatchCreateRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        file:
          type: string
          format: binary
        sheet:
          type: string
          description: A roster workbook's sheet to read; else the one it opens on.
      required:
      - file
      - kind
    ImportBatchCreated:
      type: object
      description: |-
        The new batch's id, plus one-shot creation-response extras: a
        duplicate-hash warning and the file's own headers, so the frontend can
        build its mapping step without a second request. Not persisted state.
      properties:
        id:
          type: integer
          readOnly: true
        already_imported_warning:
          type: boolean
          readOnly: true
        detected_headers:
          type: array
          items:
            type: string
          readOnly: true
        suggested_mapping:
          type: object
          additionalProperties:
            type: string
          readOnly: true
      required:
      - already_imported_warning
      - detected_headers
      - id
      - suggested_mapping
    ImportBatchStatusEnum:
      enum:
      - UPLOADED
      - COMMITTED
      - CANCELLED
      - EXPIRED
      type: string
      description: |-
        * `UPLOADED` - Uploaded
        * `COMMITTED` - Imported
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
    ImportField:
      type: object
      description: One field of KukGrade's a roster's columns are matched to.
      properties:
        field:
          type: string
        name:
          type: string
          description: The field's name on screen.
        needed:
          type: boolean
          description: Every student must have it.
        whole_file:
          type: boolean
          description: It can be given once for the whole file.
      required:
      - field
      - name
      - needed
      - whole_file
    ImportMappingRequest:
      type: object
      description: |-
        POST /{id}/mapping/: how a roster maps onto KukGrade.

        A column for each field, a whole-file value for a field the file lacks
        (current_rank or status only), and the columns to keep as extra
        information. A needed field with neither is typed into each row as a fix.
      properties:
        column_mapping:
          type: object
          additionalProperties:
            type: string
        defaults:
          type: object
          additionalProperties:
            type: string
          description: current_rank and/or status, used where a row has none.
        extra_columns:
          type: array
          items:
            type: string
            minLength: 1
          description: The file's columns to keep as each student's extra information.
      required:
      - column_mapping
    ImportPreview:
      oneOf:
      - $ref: '#/components/schemas/StudentImportPreview'
      - $ref: '#/components/schemas/LegacyImportPreview'
    ImportRecordsVoidRequest:
      type: object
      description: 'POST /{id}/void-records/: void every record a historical import
        made.'
      properties:
        reason:
          type: string
          minLength: 1
          description: Why, kept on every record.
      required:
      - reason
    ImportRecordsVoided:
      type: object
      properties:
