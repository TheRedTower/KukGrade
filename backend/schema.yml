          readOnly: true
          description: What an import's file said that KukGrade has no field for.
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_of_birth:
          type: string
          format: date
        current_rank:
          type: integer
        current_rank_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StudentStatusEnum'
        status_display:
          type: string
          readOnly: true
        can_be_graded:
          type: boolean
          readOnly: true
        next_rank:
          type: integer
          nullable: true
          readOnly: true
          description: 'The rank the student would be graded for next: their next
            active rank, when its syllabus is recorded. Null when there is none.'
        next_rank_name:
          type: string
          nullable: true
          readOnly: true
        can_be_deleted:
          type: boolean
          readOnly: true
          description: 'Whether the viewer may delete this student now: they may delete
            students, and no grading the student is in is waiting for its final decision.'
        deletion_blocked_by:
          type: string
          nullable: true
          readOnly: true
          description: Why the student cannot be deleted yet, naming the grading that
            waits for its decision; null when nothing stands in the way.
        age_band_display:
          type: string
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - age_band_display
      - can_be_deleted
      - can_be_graded
