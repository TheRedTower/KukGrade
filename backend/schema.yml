          type: string
          readOnly: true
        current_rank_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StudentStatusEnum'
        status_display:
          type: string
          readOnly: true
        can_be_graded:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
