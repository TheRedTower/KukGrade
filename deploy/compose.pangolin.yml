# KukGrade behind a Pangolin tunnel: no port is opened on this host. Put
# PANGOLIN_ENDPOINT, NEWT_ID and NEWT_SECRET (from Pangolin) in .env, and add a
# Pangolin resource whose target is http://kukgrade:6942.
#   docker compose -f compose.pangolin.yml up -d
services:
  kukgrade:
    image: ghcr.io/theredtower/kukgrade:latest
    # Until the image is published, the first `up` builds it from this checkout.
    build: ..
    restart: unless-stopped
    stop_grace_period: 2m
    env_file: .env
    volumes:
      - ./data:/var/lib/kukgrade

  newt:
    image: fosrl/newt:latest
    restart: unless-stopped
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?Set PANGOLIN_ENDPOINT in .env}
      NEWT_ID: ${NEWT_ID:?Set NEWT_ID in .env}
      NEWT_SECRET: ${NEWT_SECRET:?Set NEWT_SECRET in .env}
