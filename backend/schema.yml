          readOnly: true
        wksa_id:
          type: string
          maxLength: 32
        wksa_id_can_change:
          type: boolean
          readOnly: true
          description: Whether the ID is still a student ID, so the change to a black
            belt ID is still to come. Either form can be corrected.
        previous_wksa_ids:
          type: array
          items:
            $ref: '#/components/schemas/PreviousWksaId'
          readOnly: true
        extra_information:
          type: array
