        Detail, create and update. wksa_id is writable only on create.

        One serializer rather than three: create and update share every field
        except wksa_id, and splitting them further would just be the same
        fields copied into different classes.
      properties:
        id:
          type: integer
          readOnly: true
        wksa_id:
          type: string
          maxLength: 32
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_of_birth:
          type: string
          format: date
        current_rank:
          type: integer
        current_rank_name:
          type: string
          readOnly: true
        status:
