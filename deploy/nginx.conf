# nginx in front of KukGrade (deploy/compose.nginx.yml).
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;

    # A little above the app's import limit (KUKGRADE_UPLOAD_MAX_BYTES, 5 MiB),
    # so an oversized upload is refused here before the app buffers it.
    client_max_body_size 6m;

    # Docker's DNS, asked per request: a replaced app container is found again
    # without restarting nginx.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://kukgrade:6942;
        proxy_pass $upstream;
        # $http_host keeps a non-default port, which the browser's Origin and the
        # app's CSRF check expect (DJANGO_CSRF_TRUSTED_ORIGINS).
        proxy_set_header Host $http_host;
        # Discard whatever the client sent and start the chain from the address
        # nginx saw: this is the first (and only) proxy, DJANGO_NUM_PROXIES=1.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
