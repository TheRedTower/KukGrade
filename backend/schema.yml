openapi: 3.0.3
info:
  title: KukGrade API
  version: 1.0.0
  description: Grading management API for Kuk Sool Won instructors and administrators.
paths:
  /api/audit-events/:
    get:
      operationId: audit_events_list
      description: 'Read-only by construction: the model refuses writes from every
        path.'
      parameters:
      - name: action
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - ASSESSMENT_COMPLETED
          - ASSESSMENT_DELETED
          - ASSESSMENT_GENERATED
          - ASSESSMENT_REOPENED
          - ASSESSMENT_STARTED
          - CANDIDATE_DELETED
          - CANDIDATE_REGISTERED
          - CANDIDATE_UPDATED
          - CANDIDATE_WITHDRAWN
          - IMPORT_BATCH_CANCELLED
          - IMPORT_BATCH_COMMITTED
          - IMPORT_BATCH_EXPIRED
          - ITEM_RESULT_RECORDED
          - LEGACY_GRADING_LINKED
          - LEGACY_GRADING_RANK_RESOLVED
          - LEGACY_GRADING_UNLINKED
          - LEGACY_GRADING_VOIDED
          - OUTCOME_CREATED
          - OUTCOME_FINALISED
          - OUTCOME_PROPOSED
          - PROMOTION_RECORDED
          - SESSION_CREATED
          - SESSION_DELETED
          - SESSION_TRANSITIONED
          - STUDENT_CREATED
          - STUDENT_DELETED
          - STUDENT_STATUS_CHANGED
          - STUDENT_UPDATED
          - USER_AUTHORITY_CHANGED
          - USER_CREATED
          - USER_DELETED
          - USER_UPDATED
      - name: entity_id
        required: false
        in: query
        description: ''
        schema:
          type: string
      - name: entity_type
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - CandidateAssessment
          - CandidateAssessmentItem
          - CandidateOutcome
          - GradingCandidate
          - GradingSession
          - ImportBatch
          - LegacyGradingRecord
          - Promotion
          - Student
          - User
      - name: occurred_from
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: occurred_to
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: ''
        schema:
          type: string
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
