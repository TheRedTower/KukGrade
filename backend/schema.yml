      - full_name
      - id
      - is_staff
      - is_superuser
      - last_name
      - must_change_password
      - role
      - role_display
    UserManagement:
      type: object
      description: |-
        List, retrieve, create and update for the administrator-facing API.

        Deliberately separate from UserSerializer, which is a fixed read-only
        self-view for /api/auth/me/: that one has no reason to expose is_active
        or date_joined about the caller to themselves, and has no reason to be
        writable at all. Sharing one class between the two would couple changes
        meant for one endpoint to the other.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
        can_make_final_grading_decision:
          type: boolean
          readOnly: true
        can_promote_student:
          type: boolean
          readOnly: true
        can_override_locked_session:
          type: boolean
          readOnly: true
        can_view_grading_audit_log:
          type: boolean
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        password:
          type: string
          writeOnly: true
      required:
      - can_make_final_grading_decision
      - can_override_locked_session
      - can_promote_student
      - can_view_grading_audit_log
      - date_joined
      - email
      - full_name
      - id
      - is_staff
      - is_superuser
      - last_login
      - must_change_password
      - password
      - role_display
    VoidLegacyRecord:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    WithdrawalReasonEnum:
      enum:
      - INJURY
      - WITHDREW
      - ABSENT
      - ADMIN_ERROR
      type: string
      description: |-
        * `INJURY` - Injured during grading
        * `WITHDREW` - Withdrew voluntarily
        * `ABSENT` - Did not attend
        * `ADMIN_ERROR` - Registered in error
