name: CI

on:
  # Every branch, not just dev/prod. The repo convention is to merge feature
  # branches into dev directly, so triggering on dev alone would only verify
  # a change after it had already landed.
  push:
  pull_request:

# A superseded run on the same branch is cancelled rather than left to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kukgrade
          POSTGRES_USER: kukgrade
          POSTGRES_PASSWORD: kukgrade_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukgrade -d kukgrade"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The settings module now fails closed: management commands refuse to
      # start without a secret key unless DJANGO_DEBUG is true. Tests supply
      # their own via kukgrade.settings_test.
      DJANGO_SECRET_KEY: ci-only-secret-key-000000000000000000000000000000000000
      POSTGRES_DB: kukgrade
      POSTGRES_USER: kukgrade
      POSTGRES_PASSWORD: kukgrade_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy kukgrade health accounts audit ranks students syllabus gradings data_imports

      - name: Django system checks
        run: uv run python manage.py check

      - name: Migrations match models
        run: uv run python manage.py makemigrations --check --dry-run

      # The frontend's types are generated from the committed schema, so it
      # must match the serializers exactly - regenerated and diffed here.
      - name: OpenAPI schema is current
        run: |
          uv run python manage.py spectacular --file schema.yml --validate --fail-on-warn
          git diff --exit-code -- schema.yml
        env:
          DJANGO_SETTINGS_MODULE: kukgrade.settings_test

      # Blocking at WARNING since KG-NEXT-004: the deployment check is clean,
      # so any new security warning fails the build rather than scrolling past.
      - name: Deployment checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: kukgrade.example.com

      - name: Tests
        run: uv run pytest -q -n auto

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # Pinned to an LTS line that Vite 7 supports. Local development is
      # currently on a newer Node; add an .nvmrc if that drift ever bites.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Regenerated from backend/schema.yml (both checked out from the same
      # commit) rather than hand-maintained - see the 2026-09-14 decision log
      # entry. A serializer change that nobody mirrors here fails the build
      # instead of silently drifting from the API.
      - name: Generate API types from schema
        run: npm run generate:types

      - name: Generated types are current
        run: git diff --exit-code -- src/api/schema.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # KG-020's dev/build-tooling advisories are cleared, so the gate is
      # held at high.
      - name: Dependency audit
        run: npm audit --audit-level=high

  # The runner is UTC, and a date-only value parsed as a timestamp is only
  # wrong away from UTC - so the UTC run in the Frontend job cannot see that
  # class of bug at all. A second run west of UTC is what actually guards it;
  # without this, tests asserting `grading_date`, `effective_date` or
  # `date_of_birth` pass just as happily on broken parsing. It is its own job
  # so it runs alongside the first rather than after it.
  frontend-timezone:
    name: Frontend tests (non-UTC timezone)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test
        env:
          TZ: America/Los_Angeles

  container:
    name: Production image
    # Not gated on the test jobs: it only builds, so it runs alongside them.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # compose.prod.yml loads .env.production into the container, and that
      # file only exists on the deployment host - validate against a copy of
      # the committed template instead.
      - name: Validate production Compose template
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f compose.prod.yml config --no-env-resolution --quiet

      - name: Build production image
        run: docker build --target production -t kukgrade:ci .

      - name: Check production settings in image
        run: >-
          docker run --rm
          --entrypoint python
          -e DJANGO_SECRET_KEY=ci-only-secret-key-000000000000000000000000000000000000
          -e DJANGO_ALLOWED_HOSTS=www.kukgrade.co.uk
          kukgrade:ci
          manage.py check --deploy --fail-level WARNING
