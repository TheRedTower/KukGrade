<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KukGrade</title>
    <link rel="icon" type="image/svg+xml" href="/src/assets/kukgrade-mark.svg" />
    <script>
      // Applied before first paint, so the page never flashes the other
      // theme first. The resolved theme - the stored choice, else the
      // system preference - is always set, because component overrides are
      // written as [data-theme="dark"] .x; src/useTheme.ts keeps it current
      // and reads and writes the same "kukgrade-theme" key.
      (function () {
        var theme = null;
        try {
          var stored = window.localStorage.getItem("kukgrade-theme");
          if (stored === "light" || stored === "dark") {
            theme = stored;
          }
        } catch (error) {
          // Private browsing or a blocked store: follow the system default,
          // same as if no preference had ever been stored.
        }
        if (theme === null) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
