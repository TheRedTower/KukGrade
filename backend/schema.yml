  /api/gradings/legacy-records/:
    get:
      operationId: gradings_legacy_records_list
      description: |-
        Historical import records - read for both roles, reconciliation
        (link/unlink/resolve-rank/void) administrator-only (import Decisions 1
        and 15). No ordinary create/update/delete: rows are only ever
        created by data_imports.services.commit_legacy_grading_import, and only
        ever changed through the five gradings.legacy_services functions.
      parameters:
      - name: linked
        required: false
        in: query
        description: ''
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: voided
        required: false
        in: query
        description: ''
        schema:
          type: boolean
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLegacyGradingRecordList'
          description: ''
