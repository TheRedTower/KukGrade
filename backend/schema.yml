openapi: 3.0.3
info:
  title: KukGrade API
  version: 0.1.0
  description: Grading management API for Kuk Sool Won instructors and administrators.
paths:
  /api/about/:
    get:
      operationId: about_retrieve
      description: |-
        What is running: the About page, and what to quote when asking for help.

        For anyone signed in. Nothing here is personal data, but a build's exact
        version and commit are more than the sign-in page needs to show.
      tags:
      - about
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
          description: ''
  /api/audit-events/:
    get:
      operationId: audit_events_list
      description: 'Read-only by construction: the model refuses writes from every
        path.'
      parameters:
      - name: action
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - ASSESSMENT_COMPLETED
          - ASSESSMENT_DELETED
          - ASSESSMENT_GENERATED
          - ASSESSMENT_REOPENED
          - ASSESSMENT_STARTED
          - ASSESSMENT_UPDATED
          - CANDIDATE_DELETED
          - CANDIDATE_REGISTERED
          - CANDIDATE_UPDATED
          - CANDIDATE_WITHDRAWN
          - IMPORT_BATCH_CANCELLED
          - IMPORT_BATCH_COMMITTED
          - IMPORT_BATCH_EXPIRED
          - ITEM_RESULT_RECORDED
          - LEGACY_GRADING_LINKED
          - LEGACY_GRADING_RANK_RESOLVED
          - LEGACY_GRADING_UNLINKED
          - LEGACY_GRADING_VOIDED
          - OUTCOME_CREATED
          - OUTCOME_FINALISED
          - OUTCOME_PROPOSED
          - PROMOTION_RECORDED
          - SESSION_CREATED
          - SESSION_DELETED
          - SESSION_TRANSITIONED
          - SESSION_UPDATED
          - STUDENT_CREATED
          - STUDENT_DELETED
          - STUDENT_STATUS_CHANGED
          - STUDENT_UPDATED
          - USER_AUTHORITY_CHANGED
          - USER_CREATED
          - USER_DELETED
          - USER_UPDATED
      - name: entity_id
        required: false
        in: query
        description: ''
        schema:
          type: string
      - name: entity_type
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - CandidateAssessment
          - CandidateAssessmentItem
          - CandidateOutcome
          - GradingCandidate
          - GradingSession
          - ImportBatch
          - LegacyGradingRecord
          - Promotion
          - Student
          - User
      - name: occurred_from
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: occurred_to
        required: false
        in: query
        description: ''
        schema:
          type: string
          format: date
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: ''
        schema:
          type: string
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/audit-events/labels/:
    get:
      operationId: audit_events_labels_retrieve
      description: |-
        The event and record types the caller may filter by, with their
        names - the same events visible_to() lets them read.
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLabels'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSelfProfileRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/data-imports/batches/:
    get:
      operationId: data_imports_batches_list
      description: |-
        Administrator-only bulk data import (import Decision 1).

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - name: kind
        required: false
        in: query
        description: ''
        schema:
          type: string
          enum:
          - LEGACY_GRADINGS
          - STUDENT_ROSTER
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: status
        required: false
        in: query
        description: Comma-separated; one of CANCELLED, COMMITTED, EXPIRED, UPLOADED.
        schema:
          type: string
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportBatchList'
          description: ''
    post:
      operationId: data_imports_batches_create
      description: |-
        Administrator-only bulk data import (import Decision 1).

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportBatchCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchCreated'
          description: ''
  /api/data-imports/batches/{id}/:
    get:
      operationId: data_imports_batches_retrieve
      description: |-
        Administrator-only bulk data import (import Decision 1).

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/cancel/:
    post:
      operationId: data_imports_batches_cancel_create
      description: |-
        Administrator-only bulk data import (import Decision 1).

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/data-imports/batches/{id}/commit/:
    post:
      operationId: data_imports_batches_commit_create
      description: |-
        Finish the import. With no body, the stored mapping, fixes and rank
        choices are used; any given here replace them first.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/mapping/:
    post:
      operationId: data_imports_batches_mapping_create
      description: Match a roster's columns to KukGrade's fields, and check every
        row.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportMappingRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/preview/:
    post:
      operationId: data_imports_batches_preview_create
      description: |-
        Administrator-only bulk data import (import Decision 1).

        No `INSTRUCTOR_GROUP` permission is ever granted for this app - see
        `accounts.groups._DATA_IMPORT_PERMISSIONS`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreview'
          description: ''
  /api/data-imports/batches/{id}/rows/:
    get:
      operationId: data_imports_batches_rows_list
      description: The import's rows, a page at a time, in file order.
      parameters:
      - in: query
        name: corrected
        schema:
          type: boolean
        description: Only rows with (or without) a fix of the importer's.
      - in: query
        name: filled
        schema:
          type: string
          enum:
          - current_rank
          - status
        description: A roster's rows whose value for this field the file did not give
          and nobody typed in, so the whole-file value or KukGrade's default was used.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - EXCLUDED
          - READY
          - REVIEW_REQUIRED
          - SKIP_EXISTING
        description: Only rows with this outcome.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: rank_text
        schema:
          type: string
        description: A historical import's rows that write a rank this way, held or
          tested for (any case).
      - in: query
        name: record_kind
        schema:
          type: string
        description: 'A historical import''s rows of these kinds, comma-separated:
          GRADING_RESULT, AUXILIARY_NOTE, DID_NOT_ATTEND.'
      - in: query
        name: search
        schema:
          type: string
        description: Matches any of the row's values.
      - in: query
        name: worth_a_look
        schema:
          type: boolean
        description: Only rows with (or without) issues.
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedImportRowList'
          description: ''
  /api/data-imports/batches/{id}/rows/{row_number}/:
    patch:
      operationId: data_imports_batches_rows_partial_update
      description: Fix a roster row's values; every row is checked again.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - in: path
        name: row_number
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedImportRowCorrectionRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRow'
          description: ''
  /api/data-imports/batches/{id}/rows/{row_number}/exclusion/:
    post:
      operationId: data_imports_batches_rows_exclusion_create
      description: Leave a row out of the import, or bring it back.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      - in: path
        name: row_number
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRowExclusionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRow'
          description: ''
  /api/data-imports/batches/{id}/rows/leave-out-attention/:
    post:
      operationId: data_imports_batches_rows_leave_out_attention_create
      description: Leave out every roster row still needing attention, in one go.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/sheet/:
    post:
      operationId: data_imports_batches_sheet_create
      description: |-
        Read a roster from another sheet of its workbook; the column matches
        and fixes made for the old sheet go.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportSheetRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
          description: ''
  /api/data-imports/batches/{id}/void-records/:
    post:
      operationId: data_imports_batches_void_records_create
      description: |-
        Void every record a finished historical import created - for a
        wrong file imported. Records are never deleted.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this import batch.
        required: true
      tags:
      - data-imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRecordsVoidRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRecordsVoided'
          description: ''
  /api/gradings/assessment-items/:
    get:
      operationId: gradings_assessment_items_list
      parameters:
      - name: assessment
        required: false
        in: query
        description: ''
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateAssessmentItemList'
          description: ''
  /api/gradings/assessment-items/{id}/:
    patch:
      operationId: gradings_assessment_items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment
          item.
        required: true
      tags:
      - gradings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAssessmentItem'
          description: ''
  /api/gradings/assessments/:
    get:
      operationId: gradings_assessments_list
      parameters:
      - name: candidate
        required: false
        in: query
        description: ''
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: session
        required: false
        in: query
        description: ''
        schema:
          type: integer
      - name: status
        required: false
        in: query
        description: Comma-separated; one of COMPLETED, IN_PROGRESS, NOT_STARTED.
        schema:
          type: string
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCandidateAssessmentList'
          description: ''
  /api/gradings/assessments/{id}/:
    patch:
      operationId: gradings_assessments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment.
        required: true
      tags:
      - gradings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCandidateAssessmentRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAssessment'
          description: ''
    delete:
      operationId: gradings_assessments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment.
        required: true
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/gradings/assessments/{id}/reopen/:
    post:
      operationId: gradings_assessments_reopen_create
      description: Return a completed assessment to in-progress while the session
        is open.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment.
        required: true
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAssessment'
          description: ''
  /api/gradings/assessments/{id}/summary/:
    get:
      operationId: gradings_assessments_summary_retrieve
      description: |-
        Category and overall rollup for one assessment, at any status.

        Served here rather than recounted by the client, so scoring, review
        and the final-decision board all read the same counts. See FDR-046.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this candidate assessment.
        required: true
      tags:
      - gradings
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateAssessmentSummary'
          description: ''
  /api/gradings/assessments/bulk-start/:
    post:
      operationId: gradings_assessments_bulk_start_create
      tags:
      - gradings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAssessmentStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkAssessmentStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkAssessmentStartRequest'
        required: true
