openapi: 3.0.3
info:
  title: KukGrade API
  version: 1.0.0
  description: Grading management API for Kuk Sool Won instructors and administrators.
paths:
  /api/audit-events/:
    get:
      operationId: audit_events_list
      description: 'Read-only by construction: the model refuses writes from every
        path.'
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit-events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/audit-events/{id}/:
    get:
      operationId: audit_events_retrieve
      description: 'Read-only by construction: the model refuses writes from every
        path.'
      parameters:
