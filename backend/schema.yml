        status_display:
          type: string
          readOnly: true
        age_band:
          type: string
          readOnly: true
        age_band_display:
          type: string
          readOnly: true
      required:
      - age_band
      - age_band_display
      - current_rank
      - current_rank_code
      - current_rank_name
      - first_name
      - id
      - last_name
      - status
      - status_display
      - wksa_id
    StudentRankHistory:
      type: object
      properties:
        student:
          type: integer
          readOnly: true
        student_display_name:
          type: string
          readOnly: true
        student_wksa_id:
          type: string
          readOnly: true
        current_rank:
          type: integer
          readOnly: true
        current_rank_code:
          type: string
          readOnly: true
        current_rank_name:
          type: string
          readOnly: true
        promotions:
          type: array
          items:
