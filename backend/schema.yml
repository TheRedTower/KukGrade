          $ref: '#/components/schemas/StudentStatusEnum'
        status_display:
          type: string
          readOnly: true
        can_be_graded:
          type: boolean
          readOnly: true
        age_band:
          type: string
          readOnly: true
        age_band_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
