      description: |-
        * `AGE_8_AND_UNDER` - 8 and under
        * `AGE_9_TO_12` - 9-12
        * `AGE_13_TO_17` - 13-17
        * `AGE_18_AND_OVER` - 18+
    AssessmentCategorySummary:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the assessment `summary`
        endpoint and each assessment's `overall` return. Neither serializes a
        model, and without this the generated contract claims the viewset's own
        `serializer_class`. Read-only: nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/SyllabusItemCategoryEnum'
          readOnly: true
      required:
      - all_required_assessed
      - category
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - total
    AssessmentItemComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_name:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        after_lock:
          type: boolean
          readOnly: true
          description: Written after the session was locked.
      required:
      - after_lock
      - author_name
      - body
      - created_at
      - id
    AssessmentItemCommentRequestRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - body
    AssessmentItemResultChange:
      type: object
      properties:
        sequence:
          type: integer
          readOnly: true
          description: Its place in the item's history, from 1.
        from_result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
        to_result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
        changed_by_name:
          type: string
          readOnly: true
        changed_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          readOnly: true
        after_lock:
          type: boolean
          readOnly: true
          description: Made after the session was locked.
      required:
      - after_lock
      - changed_at
      - changed_by_name
      - from_result
      - reason
      - sequence
      - to_result
    AssessmentSummaryCounts:
      type: object
      description: |-
        Shape of one rollup block in `candidate_assessment_summary`.

        Declared so the schema tells the truth about what the assessment `summary`
        endpoint and each assessment's `overall` return. Neither serializes a
        model, and without this the generated contract claims the viewset's own
        `serializer_class`. Read-only: nothing is deserialized through it.
      properties:
        total:
          type: integer
          readOnly: true
        required:
          type: integer
          readOnly: true
        met:
          type: integer
          readOnly: true
        not_met:
          type: integer
          readOnly: true
        not_assessed:
          type: integer
          readOnly: true
        required_met:
          type: integer
          readOnly: true
        required_not_assessed:
          type: integer
          readOnly: true
        all_required_assessed:
          type: boolean
          readOnly: true
      required:
      - all_required_assessed
      - met
      - not_assessed
      - not_met
      - required
      - required_met
      - required_not_assessed
      - total
    AttendanceStatusEnum:
