    ChangePasswordRequest:
      type: object
      description: |-
        POST /api/auth/change-password/.

        Self-service, unlike SetPasswordSerializer: an administrator resetting
        someone else's password already proved their own authority to manage
        that account, so no current-password check applies there. Here the
        caller is proving they still control the account, not managing someone
        else's - current_password is required precisely because a hijacked
        session should not be enough to lock the real owner out.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    DatePrecisionEnum:
      enum:
      - MONTH
      - DAY
      type: string
      description: |-
        * `MONTH` - Month
        * `DAY` - Day
    EffectiveSyllabusRequirement:
      type: object
      description: |-
        One cumulative row for a selected rank and age band, in syllabus order.

        Wraps `syllabus.services.EffectiveSyllabusRequirement`: `requirement` is
        the effective (latest applicable) `SyllabusRequirement` row, so most
        fields are simple dotted lookups into it. `introduced_rank`,
        `effective_since_rank` and `is_new_at_rank` are the provenance FDR-041
        requires the backend to derive.
      properties:
        item_code:
          type: string
          readOnly: true
        item_name:
          type: string
          readOnly: true
        item_korean_name:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        category_display:
          type: string
          readOnly: true
        required:
          type: boolean
          readOnly: true
        display_range:
          type: string
          readOnly: true
        notation:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        introduced_rank_code:
          type: string
          readOnly: true
        introduced_rank_name:
          type: string
          readOnly: true
        effective_since_rank_code:
          type: string
          readOnly: true
        effective_since_rank_name:
          type: string
          readOnly: true
        is_new_at_rank:
          type: boolean
          readOnly: true
      required:
      - category
      - category_display
      - display_range
      - effective_since_rank_code
      - effective_since_rank_name
      - introduced_rank_code
      - introduced_rank_name
      - is_new_at_rank
      - item_code
      - item_korean_name
      - item_name
      - notation
      - notes
      - required
    GradingCandidate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        session:
          type: integer
        student:
          type: integer
        student_display_name:
          type: string
          readOnly: true
        student_wksa_id:
          type: string
          readOnly: true
        from_rank:
          type: integer
          readOnly: true
        from_rank_name:
          type: string
          readOnly: true
        testing_for_rank:
          type: integer
        testing_for_rank_name:
          type: string
          readOnly: true
        age_band_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/GradingCandidateStatusEnum'
        notes:
          type: string
        withdrawal_reason:
          oneOf:
          - $ref: '#/components/schemas/WithdrawalReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        withdrawal_reason_display:
          type: string
          readOnly: true
        withdrawal_note:
          type: string
        can_be_moved:
          type: boolean
          readOnly: true
        can_be_removed:
          type: boolean
          readOnly: true
      required:
