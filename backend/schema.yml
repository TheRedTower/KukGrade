        first_name:
          type: string
        last_name:
          type: string
        date_of_birth_display:
          type: string
        current_rank_text:
          type: string
        current_rank_code:
          type: string
          nullable: true
        status:
          type: string
        issues:
          type: array
          items:
            type: string
        existing_student_id:
          type: integer
          nullable: true
        existing_student_display:
          type: string
          nullable: true
      required:
      - current_rank_code
